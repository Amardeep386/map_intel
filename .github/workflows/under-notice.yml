# Under-notice re-check (P4 · M4): every 6 hours, re-collect the LG listings whose violations are
# Under notice (a notice went out in their case), then judge. A case resolves when the re-check sees
# a compliant price. Runs on a GitHub-hosted runner (US) like the LG slice until the Render worker
# takes over; skips the browser install and the run when nothing is under notice.
# Same secrets as lg-slice.yml. GitHub runs scheduled workflows from the default branch (main).
name: Under-notice re-check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to run
        default: main
  schedule:
    - cron: '15 */6 * * *'

concurrency:
  group: lg-slice
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}
      S3_OBJECT_LOCK_DAYS: ${{ secrets.S3_OBJECT_LOCK_DAYS }}
      COLLECT_EGRESS_LABEL: github-actions
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Listings under notice
        id: notice
        run: npm run under-notice -- --account lg
      - name: Install the browser
        if: ${{ steps.notice.outputs.count != '0' }}
        run: npx playwright install --with-deps chromium
      - name: Re-check
        if: ${{ steps.notice.outputs.count != '0' }}
        run: npm run scheduler -- --fire "Under-notice re-check" --account lg --due --inline
