# Render's free plan puts the API to sleep after 15 minutes without traffic, and waking it takes
# about a minute. This pings /health every 10 minutes, around the clock,
# so sign-in stays fast. One free service running all month fits in Render's 750 free hours.
# GitHub may run scheduled jobs a few minutes late and pauses them after 60 days without commits.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 120 https://map-intel-api.onrender.com/health
